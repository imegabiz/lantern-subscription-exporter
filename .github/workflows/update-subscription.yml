name: Update Subscription

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-subscription
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore account state
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: lantern-state-${{ github.run_id }}
          restore-keys: |
            lantern-state-

      - name: Fetch Lantern configs and build subscription
        run: python -m lantern_exporter

      - name: Save account state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .state
          key: lantern-state-${{ github.run_id }}

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add subscription/sub.txt subscription/singbox.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update subscription"
          git push
